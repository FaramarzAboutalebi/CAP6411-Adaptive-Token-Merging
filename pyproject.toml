[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap6411-adaptive-token-merging"
version = "0.1.0"
description = "Course project package for content-adaptive token merging in brain MRI segmentation."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
